doc: |
  API interface definition for the Hex Single Motor Mini Drive.

  The first 2 bytes of each message contain the message message_code. The remainder 
  of the message contains data as defined below, writting the fields in order.
  as their bit representation, little-endian.

message_codes:

  NULL_MESSAGE_CODE: 
    message_code: 0x0000

  READOUT:
    message_code: 0x2020
    type: Readout

  STREAM_FULL_READOUTS:
    message_code: 0x2021
    type: StreamFullReadouts
    returns: FULL_READOUT
    returns_len: 'stream'

  GET_READOUTS_SNAPSHOT:
    message_code: 0x2022
    returns: READOUT
    returns_len: HISTORY_SIZE

  FULL_READOUT:
    message_code: 0x2023
    type: FullReadout

  SET_STATE_OFF:
    message_code: 0x2030
    
  SET_STATE_DRIVE_6_SECTOR:
    message_code: 0x2031
    type: BasicDriveCommand

  SET_STATE_TEST_ALL_PERMUTATIONS:
    message_code: 0x2032
    type: TestCommand
    
  SET_STATE_FREEWHEEL:
    message_code: 0x2034

  SET_STATE_TEST_GROUND_SHORT:
    message_code: 0x2036
    type: TestCommand
  SET_STATE_TEST_POSITIVE_SHORT:
    message_code: 0x2037
    type: TestCommand
  SET_STATE_TEST_U_DIRECTIONS:
    message_code: 0x2039
    type: TestCommand
  SET_STATE_TEST_U_INCREASING:
    message_code: 0x203a
    type: TestCommand
  SET_STATE_TEST_U_DECREASING:
    message_code: 0x203b
    type: TestCommand
  SET_STATE_TEST_V_INCREASING:
    message_code: 0x203c
    type: TestCommand
  SET_STATE_TEST_V_DECREASING:
    message_code: 0x203d
    type: TestCommand
  SET_STATE_TEST_W_INCREASING:
    message_code: 0x203e
    type: TestCommand
  SET_STATE_TEST_W_DECREASING:
    message_code: 0x203f
    type: TestCommand
  SET_STATE_HOLD_U_POSITIVE:
    message_code: 0x3020
    type: HoldCommand
  SET_STATE_HOLD_V_POSITIVE:
    message_code: 0x3021
    type: HoldCommand
  SET_STATE_HOLD_W_POSITIVE:
    message_code: 0x3022
    type: HoldCommand
  SET_STATE_HOLD_U_NEGATIVE:
    message_code: 0x3023
    type: HoldCommand
  SET_STATE_HOLD_V_NEGATIVE:
    message_code: 0x3024
    type: HoldCommand
  SET_STATE_HOLD_W_NEGATIVE:
    message_code: 0x3025
    type: HoldCommand
    
  SET_STATE_DRIVE_PERIODIC:
    message_code: 0x3040
    type: SetStateDrivePeriodic
  SET_STATE_DRIVE_SMOOTH:
    message_code: 0x4030
    type: SetStateDriveSmooth
  SET_STATE_DRIVE_TORQUE:
    message_code: 0x4031
    type: SetStateDriveTorque
  SET_STATE_DRIVE_BATTERY_POWER:
    message_code: 0x4032
    type: SetStateDriveBatteryPower
  SET_STATE_DRIVE_SPEED:
    message_code: 0x4033
    type: SetStateDriveSpeed
  SET_STATE_DRIVE_TORQUE_SPEED:
    message_code: 0x4034
    type: SetStateDriveTorqueSpeed
  SET_STATE_SEEK_ANGLE:
    message_code: 0x4035
    type: SetStateSeekAngle

  CURRENT_CALIBRATION:
    message_code: 0x4040
    type: CurrentCalibration
  GET_CURRENT_CALIBRATION:
    message_code: 0x4041
    returns: CURRENT_CALIBRATION
  SET_CURRENT_CALIBRATION:
    message_code: 0x4042
    type: CurrentCalibration
    returns: CURRENT_CALIBRATION
  RESET_CURRENT_CALIBRATION:
    message_code: 0x4043
    returns: CURRENT_CALIBRATION

  CONTROL_PARAMETERS:
    message_code: 0x4049
    type: ControlParameters
  SET_CONTROL_PARAMETERS:
    message_code: 0x404a
    type: ControlParameters
    returns: CONTROL_PARAMETERS
  GET_CONTROL_PARAMETERS:
    message_code: 0x404b
    returns: CONTROL_PARAMETERS
  RESET_CONTROL_PARAMETERS:
    message_code: 0x404c
    returns: CONTROL_PARAMETERS

  SET_ANGLE:
    message_code: 0x4050
    type: SetAngle
  SET_ROTATIONS:
    message_code: 0x4051
    type: SetRotations

  SAVE_SETTINGS_TO_FLASH:
    message_code: 0x4080  
  SETTINGS_SAVED_TO_FLASH:
    message_code: 0x4081
  
  UNIT_TEST_OUTPUT:
    message_code: 0x5040
    type: UnitTestOutput

  SET_STATE_RESISTANCE_CALIBRATION:
    message_code: 0x5045
    type: TestCommand
  SET_STATE_INDUCTANCE_CALIBRATION:
    message_code: 0x5046
    type: TestCommand
  SET_STATE_POSITION_CALIBRATION_CHIRP:
    message_code: 0x5047
    type: TestCommand
  SET_STATE_POSITION_CALIBRATION_EMF:
    message_code: 0x5048
    type: TestCommand


definitions:
  HISTORY_SIZE:
    doc: Number of contiguous readouts to store in the history buffer for a snapshot.
    type: uint32
    const: 240

  MAX_MESSAGE_SIZE:
    doc: Maximum size of a message in bytes; used to allocate buffers for the messages.
    type: uint32
    const: 256

  UNIT_TEST_OUTPUT_SIZE:
    doc: Number of bytes in the unit test output; should be enough to store the output of the funky atan unit test.
    type: uint32
    const: 248

  CURRENT_UNITS_PER_AMP:
    doc: |
      Scaling factor for the current units; although values are in float32 there are internal sections of code
      that use Q1.31 integer math so we must be able to convert between the float32 and Q1.31 representations
      without losing too much precision.
    type: float32
    const: 1000000.0

  VOLTAGE_UNITS_PER_VOLT:
    doc: |
      Scaling factor for the voltage units; although values are in float32 there are internal sections of code
      that use Q1.31 integer math so we must be able to convert between the float32 and Q1.31 representations
      without losing too much precision.
    type: float32
    const: 1000000.0

  CLOCK_FREQUENCY:
    doc: |
      Clock frequency of the microcontroller. We need this value to compute the time unit for the driver.
      Each tick is ~6.94ns.
    type: int32
    const: 144000000

  PWM_BASE:
    doc: | 
      Number of clock cycles for one section of the PWM counter. The PWM is a triangle wave that goes from
      0 to PWM_BASE and back to 0. The PWM frequency is CLOCK_FREQUENCY / (2 * PWM_BASE).
      !The time unit for the driver is the duration of a whole PWM cycle, which is 2 * PWM_BASE clock cycles.
    type: int32
    const: 3072

  UnitTestOutput:
    doc: Output data from unit test.
    type: uint8
    array_len: UNIT_TEST_OUTPUT_SIZE

  Readout:
    doc: |
      Basic readout of the motor driver internal state; can be recorded contiguously
      into a history buffer after a commanded event.

    struct:
      u_drive_voltage: 
        type: float32
        doc: The PWM voltage for the U phase output.
      v_drive_voltage: 
        type: float32
        doc: The PWM voltage for the V phase output.
      w_drive_voltage: 
        type: float32
        doc: The PWM voltage for the W phase output.

      readout_number:
        type: uint16
        doc: Readout number; used to identify the readout in the history.

      angle_fix:
        type: uint8
        doc: Whether we have an angle fix and how confident it is.

      state_flags:
        type: uint8
        doc: Driver state flags; packed into a single 8-bit value.
        
      ref_readout:
        type: int16
        doc: |
          Raw reference readout (ADC value); this is the reference voltage for the current 
          readouts as seen by the amplifier. The phase readouts are relative to this voltage
          so if this is quite noisy then the phases will also be noisy. We must track it!

      u_current:
        type: float32
        doc: Phase U current readout (ADC value).

      v_current:
        type: float32
        doc: Phase V current readout (ADC value).

      w_current:
        type: float32
        doc: Phase W current readout (ADC value).

      u_current_diff:
        type: float32
        doc: Phase U current readout difference to previous readout.

      v_current_diff:
        type: float32
        doc: Phase V current readout difference to previous readout.

      w_current_diff:
        type: float32
        doc: Phase W current readout difference to previous readout.

      angle:
        type: int32
        doc: Best estimate for the rotor magnetic angle.

      angle_adjustment:
        type: int32
        doc: Error of the angle measured from EMF to the rotor angle prediction.

      angular_speed:
        type: float32
        doc: Best estimate for the rotor magnetic angular speed.

      vcc_voltage:
        type: float32
        doc: Instantaneous VCC voltage readout (ADC value); from resistance divider.
      
      emf_voltage_angle:
        type: int32
        doc: Angle of the EMF voltage vector.

      emf_voltage_magnitude:
        type: float32
        doc: |
          EMF voltage magnitude. The EMF is always along the beta direction, but we can have 
          errors in the measurements and the rotor position and thus we see alpha component 
          as well. We can rotate the EMF voltage vector fully to the beta direction and get 
          closer to the actual EMF voltage magnitude.

      emf_voltage_angular_speed:
        type: float32
        doc: Angular speed of the EMF voltage vector.
        
      current_angle:
        type: int32
        doc: Angle of the current vector.

      current_magnitude:
        type: float32
        doc: Magnitude of the current vector.  

      current_angular_speed:
        type: float32
        doc: Angular speed of the current vector.


  StreamFullReadouts:
    doc: |
      Continuously send full readouts of the motor driver internal state.

    struct:
      stream_state:
        type: uint32
        doc: |
          Number of messages to send; the stream command should be repeated to keep sending messages.


  FullReadout:
    doc: |
      Complete readout of the motor driver internal state for exploration and data stream.
    
    struct_base: Readout
    
    struct:
      main_loop_rate:
        type: float32
        doc: Tick rate; the number of main loop (communication and commands) updates per second.

      adc_update_rate:
        type: float32
        doc: |
          ADC update rate; the number of ADC readouts per second. This is usually higher 
          than the main loop rate because we read the ADCs multiple times per main loop.

      temperature:
        type: float32
        doc: Instantaneous temperature readout (ADC value); from the temperature sensor.

      live_max_pwm:
        type: float32
        doc: Current maximum PWM allowed by the driver.

      cycle_start_tick:
        type: int16
        doc: |
          PWM counter value at the start of the control update. Should occur immediately 
          after the halfway point.

      cycle_end_tick:
        type: int16
        doc: |
          PWM counter value at the end of the control update. Should occur immediately 
          before the halfway point.

      direct_current:
        type: float32
        doc: Current in DQ0 coordinates; aligned with the rotor angle.

      quadrature_current:
        type: float32
        doc: Current in DQ0 coordinates; crossed with the rotor angle.

      direct_emf_voltage:
        type: float32
        doc: EMF voltage in DQ0 coordinates; aligned with the rotor angle.

      quadrature_emf_voltage:
        type: float32
        doc: EMF voltage in DQ0 coordinates; crossed with the rotor angle.

      total_power:
        type: float32
        doc: Total power used/given to VCC line (the battery usually).

      total_power_average:
        type: float32
        doc: Long duration average of the total power; used to limit the maximum power draw.

      resistive_power:
        type: float32
        doc: Resistive power; the power dissipated in the phase resistances.

      resistive_power_average:
        type: float32
        doc: Long duration average of the resistive power; used to limit the maximum resistive power.

      emf_power:
        type: float32
        doc: |
          EMF power; the power used to drive the motor (which is reflected to the 
          inductors as back EMF).

      inductive_power:
        type: float32
        doc: Inductive power; the power pushed into the inductor magnetic fields.

      rotor_acceleration:
        type: float32
        doc: The measured acceleration of the rotor.

      rotations:
        type: int32
        doc: Integrated number of EMF deduced rotor angle rotations since startup.

      emf_angle_error_variance:
        type: float32
        doc: Variance of the EMF angle error; used to determine if the EMF angle is too noisy to update.

      lead_angle:
        type: int32
        doc: | 
          Lead angle for the motor driving; used to adjust the phase voltages to drive the 
          motor efficiently.

      active_pwm:
        type: float32
        doc: Active PWM value for the motor outputs, value set by the advanced control algorithms.

      target:
        type: float32
        doc: Target for the advanced control algorithms.

      seek_integral:
        type: float32
        doc: Value of the integral term for the seek position algorithm.




      u_resistance:
        type: float32
        doc: Estimated resistance of the U phase coil.

      v_resistance:
        type: float32
        doc: Estimated resistance of the V phase coil.

      w_resistance:
        type: float32
        doc: Estimated resistance of the W phase coil.
      
      inductance:
        type: float32
        doc: | 
          Estimated baseline inductance of the motor coils.

      magnetization_angle:
        type: int32
        doc: |
          The estimated angle of the magnetization pattern.

          Not sure what exactly is this (maybe magnetic hysterisis) but it is proportional
          to the power transmitted to the inductor coils and is periodic, spinning twice
          as fast as the current angle. The offset of the magnetization pattern
          seems to depend on the angle of the rotor.

      magnetization_factor:
        type: float32
        doc: The magnitude of the voltage variation due to the magnetization pattern.

      motor_constant:
        type: float32
        doc: The motor constant (although it may not be constant) that relates the EMF voltage to the angular speed.
      
      friction_torque:
        type: float32
        doc: The estimated friction torque of the motor; used to know the minimum torque required to move the motor.
      
      rotor_mass:
        type: float32
        doc: The estimated inertial mass of the rotor, how fast it accelerates relative to applied torque.
        

  BasicDriveCommand:
    struct:
      pwm_value:
        type: float32
        doc: PWM value to use for driving the motor in 6 sector commutation mode.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  TestCommand:
    struct:
      pwm_value:
        type: float32
        doc: PWM value to use for the test.
      take_snapshot:
        type: uint32
        doc: Whether to take a snapshot while running the test.
      test_speed:
        type: float32
        doc: Speed target for the test.
      test_duration:
        type: uint32
        doc: Number of cycles to execute the test. Note we always record HISTORY_SIZE readouts.


  HoldCommand:
    struct:
      pwm_value:
        type: float32
        doc: PWM value to use for holding the position.
      timeout:
        type: uint32
        doc: Time in pwm periods to hold the position before stopping.

  SetStateDrivePeriodic:
    struct:
      pwm_value:
        type: float32
        doc: PWM value to use for driving the motor.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.
      angle:
        type: int32
        doc: Starting angle.
      angular_speed:
        type: float32
        doc: Angular speed to drive the motor at.
      

  SetStateDriveSmooth:
    struct:
      pwm_value:
        type: float32
        doc: PWM value to use for driving the motor.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveTorque:
    struct:
      target_current:
        type: float32
        doc: Target current in the quadrature direction; the driver will try to achieve this current by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveBatteryPower:
    struct:
      target_power:
        type: float32
        doc: Target power draw from the battery; the driver will try to achieve this power by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveSpeed:
    struct:
      target_speed:
        type: float32
        doc: Target angular speed for the motor; the driver will try to achieve this speed by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveTorqueSpeed:
    struct:
      target_current:
        type: float32
        doc: Target current in the quadrature direction; the driver will try to achieve this current by adjusting the PWM commands.
      target_speed:
        type: float32
        doc: Target angular speed for the motor; the driver will try to achieve this speed by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateSeekAngle:
    struct:
      target_rotation:
        type: int32
        doc: Target rotation for the motor; the driver will try to achieve this rotation by adjusting the PWM commands.
      target_angle:
        type: int32
        doc: Target angle for the motor; the driver will try to achieve this angle by adjusting the PWM commands.
      target_current:
        type: float32
        doc: Target current in the quadrature direction; the driver will try to achieve this current by adjusting the PWM commands.
      target_speed:
        type: float32
        doc: Target angular speed for the motor; the driver will try to achieve this speed by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.


  CurrentCalibration:
    doc: |
      Estimate resistance and inductance values for the motor coils.

    struct:
      u_resistance:
        type: float32
        doc: Estimated resistance of the U phase coil.

      v_resistance:
        type: float32
        doc: Estimated resistance of the V phase coil.

      w_resistance:
        type: float32
        doc: Estimated resistance of the W phase coil.
      
      inductance:
        type: float32
        doc: Estimated baseline inductance of the motor coils.

      magnetization_angle:
        type: int32
        doc: The estimated angle of the phase inductance variation.

      magnetization_factor:
        type: float32
        doc: The factor of the voltage variation due to the magnetization pattern.

      motor_constant:
        type: float32
        doc: The motor constant (although it may not be constant) that relates the EMF voltage to the angular speed.
      
      friction_torque:
        type: float32
        doc: The estimated friction torque of the motor; used to know the minimum torque required to move the motor.

      rotor_mass:
        type: float32
        doc: The estimated inertial mass of the rotor, how fast it accelerates relative to applied torque.
      
      
  ControlParameters:
    doc: |
      Parameters used in the motor control loop; for detailed descriptions check the
      motor monitor page. It's useful to modify the values and inspect the changes to
      the respective variables in the readout while driving a physical motor.

    struct:
      min_emf_speed:
        type: float32
        doc: Minimum EMF speed to consider EMF detected, above the noise level, and with a determinate sign.

      emf_probing_interval:
        type: uint32
        doc: Time interval in pwm periods to probe the EMF angle when it's too noisy to update the angle.

      probing_angular_speed:
        type: float32
        doc: Probing angular speed for initial EMF detection.

      max_hold_pwm:
        type: float32
        doc: Maximum PWM at which we use holding commands (or probing).

      min_emf_for_motor_constant:
        type: float32
        doc: Minium EMF voltage to compute the motor constant.

      motor_direction:
        type: int16
        doc: Sign of the motor direction (positive by default, negative to reverse turning direction).

      angle_fix_max_certainty:
        type: int16
        doc: |
          Any time we can determine the correct angle of the rotor we increase the certainty by 1 and
          conversely if we cannot determine the correct angle we decrease the certainty by 1. This is
          the maximum value of certainty we can reach, we will lose the angle fix when we decay from max.

      vcc_undervoltage:
        type: float32
        doc: |
          Minimum VCC voltage for the MOSFETs (including the MOSFET driver) to work properly. We may
          also set this as the minimum battery voltage to not damage the Li-ion battery pack.

      max_resistive_power:
        type: float32
        doc: Maximum resistive power that can be dissipated in the motor coils.

      max_power_draw:
        type: float32
        doc: Maximum power draw from the battery (proxy for maximum current).
      
      resistive_power_ki:
        type: float32
        doc: Resistive power long duration average observer gain.

      power_draw_ki:
        type: float32
        doc: Power draw long duration average observer gain.
      
      rotor_angle_ki:
        type: float32
        doc: Magnet position integral gain.

      rotor_angular_speed_ki:
        type: float32
        doc: Magnet angular speed integral gain.

      rotor_acceleration_ki:
        type: float32
        doc: Averaging gain for the acceleration of the rotor.

      emf_angle_ki:
        type: float32
        doc: Integral gain for the EMF angle adjustment.

      emf_angular_speed_ki:
        type: float32
        doc: Integral gain for the EMF angular speed adjustment.

      hall_angle_ki:
        type: float32
        doc: Integral gain for the hall angle adjustment (0 to ignore).

      lead_angle_control_ki:
        type: float32
        doc: Lead angle integral gain for efficient driving.

      torque_control_ki:
        type: float32
        doc: Torque control gain.

      torque_control_kff:
        type: float32
        doc: Torque control feedforward gain.

      battery_power_control_ki:
        type: float32
        doc: Battery power control gain.

      battery_power_control_kff:
        type: float32
        doc: Battery power control feedforward gain.

      speed_control_ki:
        type: float32
        doc: Speed control gain.

      speed_control_kff:
        type: float32
        doc: Speed control feedforward gain.

      seek_kff:
        type: float32
        doc: Seek feed forward gain for torque.

      seek_ki:
        type: float32
        doc: Seek integral gain for the PID control.

      seek_kp:
        type: float32
        doc: Seek proportional gain for the PID control.

      seek_kd:
        type: float32
        doc: Seek derivative gain for the PID control.

      phase_resistance_ki:
        type: float32
        doc: Integral gain for the phase resistance observer.

      phase_inductance_ki:
        type: float32
        doc: Integral gain for the phase inductance observer.

      magnetization_angle_ki:
        type: float32
        doc: Integral gain for the magnetization angle observer.
      
      magnetization_factor_ki:
        type: float32
        doc: Integral gain for the magnetization factor observer.

      motor_constant_ki:
        type: float32
        doc: Motor constant integral gain.

      friction_torque_ki:
        type: float32
        doc: Integral gain for the friction torque observer.

      rotor_mass_ki:
        type: float32
        doc: Integral gain for the rotor mass observer.


  SetAngle:
    struct:
      angle:
        type: int32
        doc: Set the current angle of the motor; used for initial angle calibration.

  SetRotations:
    struct:
      rotations:
        type: int32
        doc: Set the number of rotations, used to home the motor.