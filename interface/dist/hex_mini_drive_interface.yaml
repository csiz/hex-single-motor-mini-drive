doc: |
  API interface definition for the Hex Single Motor Mini Drive.

  The first 2 bytes of each message contain the message message_code. The remainder 
  of the message contains data as defined below, writting the fields in order.
  as their bit representation, little-endian.

message_codes:

  NULL_MESSAGE_CODE: 
    message_code: 0x0000

  GET_VERSION:
    message_code: 0x0001
  
  VERSION:
    message_code: 0x0002
    type: Version

  READOUT:
    message_code: 0x2010
    type: Readout

  INFO:
    message_code: 0x2011
    type: Info

  STREAM_READOUTS:
    message_code: 0x2021
    type: StreamReadouts
    returns: READOUT

  GET_READOUTS_SNAPSHOT:
    message_code: 0x2022
    type: StreamReadouts
    returns: READOUT

  GET_INFO:
    message_code: 0x2023
    returns: INFO

  SET_STATE_OFF:
    message_code: 0x2030
    
  SET_STATE_FREEWHEEL:
    message_code: 0x2031

  SET_DRIVE_STATE:
    message_code: 0x2032
    type: DriveState

  SET_DRIVE_SCHEDULE:
    message_code: 0x2033
    type: DriveSchedule

  SET_STATE_DRIVE_6_SECTOR:
    message_code: 0x4031
    type: DriveState
    
  SET_STATE_SEEK_ANGLE:
    message_code: 0x4036
    type: SetStateSeekAngle

  CALIBRATION:
    message_code: 0x4040
    type: Calibration
  GET_CALIBRATION:
    message_code: 0x4041
    returns: CALIBRATION
  SET_CALIBRATION:
    message_code: 0x4042
    type: Calibration
    returns: CALIBRATION
  RESET_CALIBRATION:
    message_code: 0x4043
    returns: CALIBRATION

  CALIBRATION_INSTANCE:
    message_code: 0x4044
    type: CalibrationInstance

  CALIBRATION_PARAMETERS:
    message_code: 0x4045
    type: CalibrationParameters
  
  SET_CALIBRATION_PARAMETERS:
    message_code: 0x4046
    type: CalibrationParameters
    returns: CALIBRATION_PARAMETERS
  GET_CALIBRATION_PARAMETERS:
    message_code: 0x4047
    returns: CALIBRATION_PARAMETERS
  RESET_CALIBRATION_PARAMETERS:
    message_code: 0x4048
    returns: CALIBRATION_PARAMETERS

  CONTROL_PARAMETERS:
    message_code: 0x4049
    type: ControlParameters
  SET_CONTROL_PARAMETERS:
    message_code: 0x404a
    type: ControlParameters
    returns: CONTROL_PARAMETERS
  GET_CONTROL_PARAMETERS:
    message_code: 0x404b
    returns: CONTROL_PARAMETERS
  RESET_CONTROL_PARAMETERS:
    message_code: 0x404c
    returns: CONTROL_PARAMETERS

  SAVE_SETTINGS_TO_FLASH:
    message_code: 0x4080  
  SETTINGS_SAVED_TO_FLASH:
    message_code: 0x4081

    
  RUN_CALIBRATION_CHIRP:
    message_code: 0x4090

  RUN_CALIBRATION_STATIC:
    message_code: 0x4091

  
  UNIT_TEST_OUTPUT:
    message_code: 0x5040
    type: UnitTestOutput


definitions:
  VERSION_STRING_SIZE:
    doc: Byte length of the version string.
    type: uint32
    const: 64

  HISTORY_SIZE:
    doc: Number of contiguous readouts to store in the history buffer for a snapshot.
    type: uint32
    const: 120

  MAX_MESSAGE_SIZE:
    doc: Maximum size of a message in bytes; used to allocate buffers for the messages.
    type: uint32
    const: 256

  UNIT_TEST_OUTPUT_SIZE:
    doc: Number of bytes in the unit test output; should be enough to store the output of the funky atan unit test.
    type: uint32
    const: 248

  DRIVE_SCHEDULE_SIZE:
    doc: Number of driver states that can be queued with a single command.
    type: uint32
    const: 6

  CURRENT_UNITS_PER_AMP:
    doc: |
      Scaling factor for the current units; although values are in float32 there are internal sections of code
      that use Q1.31 integer math so we must be able to convert between the float32 and Q1.31 representations
      without losing too much precision.
    type: float32
    const: 10000000.0

  VOLTAGE_UNITS_PER_VOLT:
    doc: |
      Scaling factor for the voltage units; although values are in float32 there are internal sections of code
      that use Q1.31 integer math so we must be able to convert between the float32 and Q1.31 representations
      without losing too much precision.
    type: float32
    const: 10000000.0

  CLOCK_FREQUENCY:
    doc: |
      Clock frequency of the microcontroller. We need this value to compute the time unit for the driver.
      Each tick is ~6.94ns.
    type: int32
    const: 144000000

  PWM_BASE:
    doc: | 
      Number of clock cycles for one section of the PWM counter. The PWM is a triangle wave that goes from
      0 to PWM_BASE and back to 0. The PWM frequency is CLOCK_FREQUENCY / (2 * PWM_BASE).
      !The time unit for the driver is the duration of a whole PWM cycle, which is 2 * PWM_BASE clock cycles.
    type: int32
    const: 3072

  ENABLE_U_OUTPUT:
    doc: Flag to enable the U output of the driver.
    type: uint8
    const: 1
  ENABLE_V_OUTPUT:
    doc: Flag to enable the V output of the driver.
    type: uint8
    const: 2
  ENABLE_W_OUTPUT:
    doc: Flag to enable the W output of the driver.
    type: uint8
    const: 4
  ENABLE_Z_OUTPUT:
    doc: Flag to enable the Z output of the driver.
    type: uint8
    const: 8

  Version:
    doc: Version information of the driver.
    type: uint8
    array_len: VERSION_STRING_SIZE

  UnitTestOutput:
    doc: Output data from unit test.
    type: uint8
    array_len: UNIT_TEST_OUTPUT_SIZE

  Readout:
    doc: |
      Basic readout of the motor driver internal state; can be recorded contiguously
      into a history buffer after a commanded event.

    struct:
      readout_number:
        type: uint16
        doc: Readout number; used to identify the readout in the history.
      
      cycle_start_tick:
        type: int16
        doc: |
          PWM counter value at the start of the control update. Should occur immediately 
          after the halfway point.

      cycle_end_tick:
        type: int16
        doc: |
          PWM counter value at the end of the control update. Should occur immediately 
          before the halfway point.

      ref_readout:
        type: int16
        doc: |
          Raw reference readout (ADC value); this is the reference voltage for the current 
          readouts as seen by the amplifier. The phase readouts are relative to this voltage
          so if this is quite noisy then the phases will also be noisy. We must track it!

      x_drive_voltage:
        type: float32
        doc: The PWM voltage on the x axis.

      y_drive_voltage:
        type: float32
        doc: The PWM voltage for the y axis.

      x_current:
        type: float32
        doc: Current on the x axis.
      y_current:
        type: float32
        doc: Current on the y axis.

      zero_current:
        type: float32
        doc: The current common mode in the DQ0 transform.

      x_current_diff:
        type: float32
        doc: Difference in x current compared to the previous readout.

      y_current_diff:
        type: float32
        doc: Difference in y current compared to the previous readout.
      
      x_voltage_error:
        type: float32
        doc: Error in x voltage.
      
      y_voltage_error:
        type: float32
        doc: Error in y voltage.

      rotations:
        type: int32
        doc: Integrated number of EMF deduced rotor angle rotations since startup.
      
      angle:
        type: int32
        doc: Best estimate for the rotor magnetic angle.

      predicted_angle:
        type: int32
        doc: Rotor magnetic angle that was used to calculate the readout.

      angular_speed:
        type: float32
        doc: Best estimate for the rotor magnetic angular speed.
        
      vcc_voltage:
        type: float32
        doc: Instantaneous VCC voltage readout (ADC value); from resistance divider.
      
      emf_voltage_angle:
        type: int32
        doc: Angle of the EMF voltage vector.

      emf_voltage_magnitude:
        type: float32
        doc: |
          EMF voltage magnitude. The EMF is always along the beta direction, but we can have 
          errors in the measurements and the rotor position and thus we see alpha component 
          as well. We can rotate the EMF voltage vector fully to the beta direction and get 
          closer to the actual EMF voltage magnitude.

      emf_magnitude_variance:
        type: float32
        doc: Variance of the EMF magnitude error, we can use it to determine when EMF is detected.

      emf_voltage_angular_speed:
        type: float32
        doc: Angular speed of the EMF voltage vector.

      emf_angle_variance:
        type: float32
        doc: Variance of the EMF angle; used to determine if the EMF angle is too noisy to update.

      emf_speed_constant:
        type: float32
        doc: |
          Instantaneous emf speed constant; ratio of EMF voltage magnitude to emf angular speed; 
          gives an estimate of the motor's back-EMF constant in the interrupt control loop.
          We use this faster estimate to deduce the real rotor angular speed because it looks
          like it depends much more reliably on the EMF magnitude rather than the EMF angle
          estimation. Because the EMF response is quite noisy around motor parameter shifts
          the EMF angle is often distorted by a noise of comparable magnitude to the EMF signal.
          When differentiated, this noise often oscillates to negative values, while the emf
          magnitude changes much more slowly despite being optimized with the same learning rate.

      emf_speed_constant_variance:
        type: float32
        doc: Variance of the instantaneous emf speed constant; used to determine if the estimate is reliable.

      resistance:
        type: float32
        doc: Measured phase resistance.
      resistance_gradient:
        type: float32
        doc: Gradient of resistance.
      inductance:
        type: float32
        doc: Measured inductance value for each phase.
      inductance_gradient:
        type: float32
        doc: Gradient of inductance.
      inductance_saliency:
        type: float32
        doc: Measured inductance saliency bias.
      inductance_saliency_gradient:
        type: float32
        doc: Gradient of inductance saliency.
      saliency_angle:
        type: int32
        doc: Saliency angle for the inductance saliency effect.
      hysteresis_loss:
        type: float32
        doc: Iron loss coefficient.
      hysteresis_loss_gradient:
        type: float32
        doc: Gradient of iron loss.
      hysteresis_angle:
        type: int32
        doc: Angle for the iron loss effect.

      live_max_pwm:
        type: float32
        doc: Current maximum PWM allowed by the driver.
           
      total_power_average:
        type: float32
        doc: Long duration average of the total power; used to limit the maximum power draw.

      resistive_power_average:
        type: float32
        doc: Long duration average of the resistive power; used to limit the maximum resistive power.

      emf_stable_magnitude:
        type: float32
        doc: A slower varying estimate of the EMF voltage magnitude.

      active_pwm:
        type: float32
        doc: Current active PWM value applied to the motor.
      active_angle:
        type: int32
        doc: Current angle of the driving PWM signal applied to the motor.

        
  StreamReadouts:
    doc: |
      Continuously send readouts of the motor driver internal state.

    struct:
      stream_state:
        type: uint32
        doc: Number of messages to send or whether the stream is on/off.

  Info:
    doc: |
      Additional info about the running state of the driver.

    struct:
      main_loop_rate:
        type: float32
        doc: Tick rate; the number of main loop (communication and commands) updates per second.

      adc_update_rate:
        type: float32
        doc: |
          ADC update rate; the number of ADC readouts per second. This is usually higher 
          than the main loop rate because we read the ADCs multiple times per main loop.

      average_buffer_fill_rate:
        type: float32
        doc: Average size of the readout batch processed per main loop iteration.

      temperature:
        type: float32
        doc: Temperature readout from the internal temperature sensor.


  Calibration:
    doc: Final calibration values used during live control of the motor.

    struct:
      u_current_zero:
        type: float32
        doc: Estimated zero-current offset for the U phase.
      v_current_zero:
        type: float32
        doc: Estimated zero-current offset for the V phase.
      w_current_zero:
        type: float32
        doc: Estimated zero-current offset for the W phase.

      resistance:
        type: float32
        doc: Estimated baseline resistance of the motor coils.

      inductance:
        type: float32
        doc: |
          Estimated baseline inductance of the motor coils. Written as a conductance
          for efficient math: `conductance = delta_t/L`.

      inductance_saliency:
        type: float32
        doc: Estimated bias of the inductance due to magnetic saliency.

      hysteresis_loss:
        type: float32
        doc: Iron loss coefficient.

      eddy_resistance:
        type: float32
        doc: Iron resistance coefficient.

      motor_constant:
        type: float32
        doc: The motor constant (although it may not be constant) that relates the EMF voltage to the angular speed.

      u_pwm_offset:
        type: float32
        doc: U phase PWM value when the MOSFET starts conducting linearly.

      v_pwm_offset:
        type: float32
        doc: V phase PWM value when the MOSFET starts conducting linearly.

      w_pwm_offset:
        type: float32
        doc: W phase PWM value when the MOSFET starts conducting linearly.

      temperature_coefficient:
        type: float32
        doc: Temperature coefficient for the motor.

      temperature_timescale:
        type: float32
        doc: Timescale for temperature changes.


  CalibrationInstance:
    doc: Instance of the calibration process for a specific pwm, speed and drive configuration.

    struct:
      count:
        type: uint32
        doc: Number of calibration data points.
      target_pwm:
        type: float32
        doc: Target PWM value for this calibration instance.
      target_speed:
        type: float32
        doc: Target speed for this calibration instance.
      stable:
        type: uint8
        doc: Whether the calibration is stable.
      resistance_excited:
        type: uint8
        doc: Whether resistance was excited.
      inductance_excited:
        type: uint8
        doc: Whether inductance was excited.
      hysteresis_excited:
        type: uint8
        doc: Whether hysteresis was excited.
      avg_square_voltage:
        type: float32
        doc: Drive voltage squared used during this calibration instance.
      avg_square_current:
        type: float32
        doc: Current magnitude squared during this calibration instance.
      avg_square_error:
        type: float32
        doc: Average squared error during this calibration instance.
      gradients_dot:
        type: float32
        doc: Dot product of gradients.
      learning_rate_multiplier:
        type: float32
        doc: Multiplier for the learning rate.
      learning_rate_cap:
        type: float32
        doc: Cap for the learning rate multiplier.
      resistance_excitation_fraction:
        type: float32
        doc: Fraction of data points where current was high enough to meaningfully measure resistance.
      inductance_excitation_fraction:
        type: float32
        doc: Fraction of data points where current change was high enough to measure inductance.
      hysteresis_excitation_fraction:
        type: float32
        doc: Fraction of data points where hysteresis was excited.

      resistance:
        type: float32
        doc: Measured phase resistance.
      inductance:
        type: float32
        doc: Measured inductance value for each phase.
      inductance_saliency:
        type: float32
        doc: Measured inductance saliency bias.
      saliency_angle:
        type: int32
        doc: Saliency angle for the inductance saliency effect.
      hysteresis_loss:
        type: float32
        doc: Iron loss coefficient.
      hysteresis_angle:
        type: int32
        doc: Angle for the iron loss effect.


  DriveState:
    doc: |
      The complete driver state, these values control the motor behaviour.

    struct:
      motor_flags:
        type: uint8
        doc: Flags controlling the behavior of the motor drive.
      closed_loop:
        type: uint8
        doc: |
          Enable closed loop control, targetting a current, speed and drive offset 
          angle, which is usually +- 90 degrees relative to the rotor angle.
      duration:
        type: uint16
        doc: Time in pwm periods to drive the motor before stopping.
      target_value:
        type: float32
        doc: PWM or current value to use for driving the motor.
      angle_value:
        type: int32
        doc: |
          Initial angle for the the open loop drive, or drive offset relative
          to the rotor angle for closed loop control, usually +- 90 degrees.
      target_speed:
        type: float32
        doc: Open loop rotation speed, or maximum (abs) velocity for closed loop control.
        
          
  DriveSchedule:
    doc: Set a series of driver states to be executed by the motor in sequence.
    type: DriveState
    array_len: DRIVE_SCHEDULE_SIZE

  SetStateDriveTorque:
    struct:
      target_current:
        type: float32
        doc: Target current in the quadrature direction; the driver will try to achieve this current by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveBatteryPower:
    struct:
      target_power:
        type: float32
        doc: Target power draw from the battery; the driver will try to achieve this power by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveSpeed:
    struct:
      target_speed:
        type: float32
        doc: Target angular speed for the motor; the driver will try to achieve this speed by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateDriveTorqueSpeed:
    struct:
      target_current:
        type: float32
        doc: Target current in the quadrature direction; the driver will try to achieve this current by adjusting the PWM commands.
      target_speed:
        type: float32
        doc: Target angular speed for the motor; the driver will try to achieve this speed by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  SetStateSeekAngle:
    struct:
      target_rotation:
        type: int32
        doc: Target rotation for the motor; the driver will try to achieve this rotation by adjusting the PWM commands.
      target_angle:
        type: int32
        doc: Target angle for the motor; the driver will try to achieve this angle by adjusting the PWM commands.
      target_current:
        type: float32
        doc: Target current in the quadrature direction; the driver will try to achieve this current by adjusting the PWM commands.
      target_speed:
        type: float32
        doc: Target angular speed for the motor; the driver will try to achieve this speed by adjusting the PWM commands.
      timeout:
        type: uint32
        doc: Time in pwm periods to drive the motor before stopping.

  CalibrationParameters:
    doc: Parameters for motor calibration.

    struct:
      current_variance:
        type: float32
        doc: The measurement noise for the resistance current sensing, values under this threshold are likely 0.
      inductance_variance:
        type: float32
        doc: We want our measurement error to be above this noise variance to count as a signal.
      voltage_variance:
        type: float32
        doc: Expected baseline variance of our voltage measurements.
      hysteresis_variance:
        type: float32
        doc: Minimum square of the inductance excitation to consider it significant.

      multiplier_stable_threshold:
        type: float32
        doc: Threshold for stable multiplier.
      multiplier_change:
        type: float32
        doc: Change rate for the multiplier.
      multiplier_cap_decay:
        type: float32
        doc: Decay rate for the multiplier cap.
      excitation_threshold:
        type: float32
        doc: Threshold for excitation.
      
      current_offset_maximum:
        type: float32
        doc: Maximum allowable current offset to adjust the current sensing bias from 0.

      zero_current_ki:
        type: float32
        doc: Integral gain for the zero current adjustment.
 
      resistance_ki:
        type: float32
        doc: Integral gain for the phase resistance observer.

      inductance_ki:
        type: float32
        doc: Integral gain for the phase inductance observer.

      inductance_saliency_ki:
        type: float32
        doc: Integral gain for the inductance saliency observer.

      saliency_angle_ki:
        type: float32
        doc: Integral gain for the saliency angle observer.
      
      hysteresis_loss_ki:
        type: float32
        doc: Iron loss factor integral gain.
      hysteresis_angle_ki:
        type: float32
        doc: Iron loss angle integral gain.

      eddy_resistance_ki:
        type: float32
        doc: Eddy current integral gain.

      motor_constant_ki:
        type: float32
        doc: Motor constant integral gain.

      stats_ki:
        type: float32
        doc: Calibration statistics integral gain.

      instance_duration:
        type: uint16
        doc: Maximum duration of a calibration instance. Calibration usually finishes early when parameters stabilize.
      
      remember_intermediate:
        type: uint8
        doc: Remember intermediate calibration results.
      
      advance_when_stable:
        type: uint8
        doc: Advance calibration when parameters are stable.

      target_pwm_base:
        type: float32
        doc: Base PWM for calibration.
      
      target_pwm_increment:
        type: float32
        doc: Increment for PWM during calibration.
      
      target_pwm_max:
        type: float32
        doc: Maximum PWM for calibration.

      speed_base:
        type: float32
        doc: Base speed (angular frequency) for the calibration probe.

      speed_multiplier:
        type: float32
        doc: |
          Multiplier for the calibration speed, by default it's set to an 2^(1/12) so we create a musical scale.
          That is 12 semitones per octave. And we span a few octaves for the whole calibration sweep.

      speed_max:
        type: float32
        doc: Maximum speed for calibration.
      
      nominal_speed_inverse:
        type: float32
        doc: |
          Because our parameters depend on the angle of excitation we must scale the gradients down when the speed
          is low so we can average the gradients over a whole rotation. For speed of computation we need the inverse
          of the nominal speed. At nominal speed the gradient learning rate multiplier is 1.



  ControlParameters:
    doc: |
      Parameters used in the motor control loop; for detailed descriptions check the
      motor monitor page. It's useful to modify the values and inspect the changes to
      the respective variables in the readout while driving a physical motor.

    struct:
      rotation_zero:
        type: int32
        doc: The user set zero position of the rotor in terms of rotation count.

      angle_zero:
        type: int32
        doc: The user set zero position of the rotor relative to the angle.

      motor_direction:
        type: int16
        doc: Sign of the motor direction (positive by default, negative to reverse turning direction).

      angle_probing_interval:
        type: uint16
        doc: Time interval in pwm periods to probe the saliency angle when it's too noisy to update the angle from emf.
        
      angle_probing_pwm:
        type: float32
        doc: PWM magnitude used for angle probing with HFI (High-Frequency Injection).

      angle_probing_sweep_duration:
        type: uint32
        doc: Duration of an angle probing sweep for HFI (the full probe has 4 sweeps).

      angle_probing_angular_speed:
        type: int32
        doc: Angular speed used for HFI probing (in integer angle units per pwm cycle).
        
      vcc_undervoltage:
        type: float32
        doc: |
          Minimum VCC voltage for the MOSFETs (including the MOSFET driver) to work properly. We may
          also set this as the minimum battery voltage to not damage the Li-ion battery pack.

      max_resistive_power:
        type: float32
        doc: Maximum resistive power that can be dissipated in the motor coils.

      max_power_draw:
        type: float32
        doc: Maximum power draw from the battery (proxy for maximum current).
      
      resistive_power_ki:
        type: float32
        doc: Resistive power long duration average observer gain.

      power_draw_ki:
        type: float32
        doc: Power draw long duration average observer gain.

      angle_from_emf_ki:
        type: float32
        doc: Integral gain for the angle and angular speed estimated from EMF.

      loop_fast_ki:
        type: float32
        doc: |
          Integral gain for fast changing values in the tight control loop. It is the same
          gain for current, emf and voltage angle so they maintain consistent response with
          eachother.

      loop_slow_ki:
        type: float32
        doc: |
          Integral gain for slow changing values in the control loop. These are mostly the
          variances of the fast measurements.

      angle_from_hall_ki:
        type: float32
        doc: Integral gain for the hall angle adjustment (0 to ignore).

      lead_angle_control_ki:
        type: float32
        doc: Lead angle integral gain for efficient driving.

      angle_from_saliency_ki:
        type: float32
        doc: Integral gain for the influence of the saliency angle on the rotor_angle.

      angle_from_hysteresis_ki:
        type: float32
        doc: Iron loss angle influence.

      emf_min_angular_speed:
        type: float32
        doc: | 
          Minimum detectable angular speed for EMF detection. This value also determines
          the maximum reliable angular speed variance. It also determines how fast we probe
          for EMF when HFI is disabled and we must rely on spinning the motor to generate a
          detectable EMF signal.

      emf_uncertainty_threshold:
        type: int32
        doc: |
          When we detect incosistent EMF measurements (static EMF or high correlation with
          the drive voltage) we need to re-enable calibration in order to isolate differing
          resistance or inductance from the observed EMF measurements. We use a counter for
          each inconsistent reading and this threshold determines when we must act.

      torque_control_ki:
        type: float32
        doc: Torque control gain.

      torque_control_kff:
        type: float32
        doc: Torque control feedforward gain.

      battery_power_control_ki:
        type: float32
        doc: Battery power control gain.

      battery_power_control_kff:
        type: float32
        doc: Battery power control feedforward gain.

      speed_control_ki:
        type: float32
        doc: Speed control gain.

      speed_control_kff:
        type: float32
        doc: Speed control feedforward gain.

      seek_kff:
        type: float32
        doc: Seek feed forward gain for torque.

      seek_ki:
        type: float32
        doc: Seek integral gain for the PID control.

      seek_kp:
        type: float32
        doc: Seek proportional gain for the PID control.

      seek_kd:
        type: float32
        doc: Seek derivative gain for the PID control.

      emf_speed_constant_ki:
        type: float32
        doc: EMF speed constant integral gain.

      emf_angle_suspected_threshold:
        type: float32
